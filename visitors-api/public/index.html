<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Visitor Manager — a modern glass-card dashboard to track and manage visitors in real time." />
    <title>Visitor Manager · Dashboard</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Floating background blobs -->
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
    <div class="blob blob-3" aria-hidden="true"></div>

    <div class="container">
      <!-- Header -->
      <header class="glass-card header-card">
        <div class="header-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </div>
        <div>
          <h1 id="page-title">Visitor Manager</h1>
          <p class="subtitle">Real-time check-in dashboard</p>
        </div>
        <div class="count-badge" id="count-badge" title="Total visitors">
          <span id="visitor-count">0</span>
          <small>visitors</small>
        </div>
      </header>

      <!-- Add Visitor Card -->
      <section class="glass-card add-card" aria-labelledby="add-section-title">
        <h2 id="add-section-title" class="section-title">Check In a Visitor</h2>
        <form id="add-form" class="add-form" novalidate>
          <div class="input-wrapper">
            <label for="visitor-name" class="sr-only">Visitor name</label>
            <input
              id="visitor-name"
              type="text"
              placeholder="Enter visitor name…"
              autocomplete="off"
              maxlength="80"
              required
            />
          </div>
          <button id="add-btn" type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M19 11H13V5a1 1 0 0 0-2 0v6H5a1 1 0 0 0 0 2h6v6a1 1 0 0 0 2 0v-6h6a1 1 0 0 0 0-2z"/>
            </svg>
            Add Visitor
          </button>
        </form>
        <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
      </section>

      <!-- Visitor List -->
      <section class="visitor-section" aria-labelledby="visitor-list-title">
        <h2 id="visitor-list-title" class="section-title list-title">Active Visitors</h2>
        <div id="visitor-list" class="visitor-grid" aria-live="polite" aria-label="Visitor list">
          <!-- Cards injected by script.js -->
        </div>
        <div id="empty-state" class="empty-state" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <circle cx="32" cy="22" r="14" stroke="currentColor" stroke-width="3"/>
            <path d="M8 56c0-13.3 10.7-24 24-24s24 10.7 24 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <p>No visitors yet. Add someone above!</p>
        </div>
      </section>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="script.js"></script>
  </body>
</html>
